java:
  environment:
    # The preview token, defined once in Jenkinsfile_CNP and substituted here by the pipeline (014 FR-012). Keep the
    # quotes: if the token is missing they render an empty string, so the service refuses to start. Unquoted, it would
    # render as null, Helm would drop the variable, and the service would fall back to local-dev-token (014 EC-003).
    JO_SECURITY_BEARER_TOKENS: "${TEST_BEARER_TOKEN}"
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
