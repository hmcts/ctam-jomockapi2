spring:
  application:
    name: ctam-jomockapi

server:
  port: 8080
  error:
    # Error bodies never expose internals (FR-026); JsonErrorController renders the shared shape.
    include-stacktrace: never
    include-message: never

logging:
  structured:
    format:
      # One JSON object per line; MDC entries such as correlationId are included automatically (research R8).
      console: logstash

jo:
  security:
    # NON-SECRET default for local/dev/Postman. Override with JO_SECURITY_BEARER_TOKENS (comma-separated).
    # The explicit placeholder is required: relaxed binding would otherwise expect JO_SECURITY_BEARERTOKENS.
    bearer-tokens: ${JO_SECURITY_BEARER_TOKENS:local-dev-token}
  reference-data:
    types:
      - name: appointment_titles
        aliases: [appointment_title]
        fixture: classpath:reference-data/appointment_titles.json
      - name: base_locations
        fixture: classpath:reference-data/base_locations.json
        # parent_id, type_id and jurisdiction_id are ids of locations, location types and jurisdictions (checked by
        # ReferenceDataReferencesTest, 007, 008, 009).
        reference-fields: [type_id, parent_id, jurisdiction_id]
        # Different locations share names; one record per location (003 FR-017).
        unique-names: false
      - name: contract_types
        fixture: classpath:reference-data/contract_types.json
        # The extract's salaried flag (004 D-3).
        boolean-fields: [salaried]
      - name: genders
        fixture: classpath:reference-data/genders.json
      - name: judiciary_roles
        fixture: classpath:reference-data/judiciary_roles.json
      - name: locations
        # Keeps the extract's E-Links ids, so parent_id values resolve (007 DR-1).
        fixture: classpath:reference-data/locations.json
        # parent_id is the id of another location, type_id of a location type (008) and jurisdiction_id of a
        # jurisdiction (009), all checked by ReferenceDataReferencesTest.
        reference-fields: [type_id, parent_id, jurisdiction_id]
        # Null for the 142 top-level locations (007 FR-011).
        nullable-reference-fields: [parent_id]
        # Different locations share names (007 EC-002).
        unique-names: false
      - name: location_types
        # Keeps the extract's E-Links ids, so locations' and base locations' type_id values resolve (008 DR-1).
        fixture: classpath:reference-data/location_types.json
        # The id of a jurisdiction, checked by ReferenceDataReferencesTest (009).
        reference-fields: [jurisdiction_id]
        # The extract's integration code (008 D-4).
        text-fields: [integration_code]
        # "Region" and "AC" repeat (008 EC-002).
        unique-names: false
      - name: jurisdictions
        # Keeps the extract's E-Links ids, so every jurisdiction_id resolves (009 DR-1).
        fixture: classpath:reference-data/jurisdictions.json
      - name: tickets
        # Keeps the extract's E-Links ids, so People authorisations' ticket_id values can resolve (010 DR-1).
        fixture: classpath:reference-data/tickets.json
        # ticket_category_id is a forward reference to ticket categories, not served yet (010 DF-8).
        reference-fields: [ticket_category_id]
        # Different categories share ticket names (010 EC-002).
        unique-names: false
