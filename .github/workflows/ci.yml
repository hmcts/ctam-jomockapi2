name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # full history for Sonar blame/new-code detection

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # Full build: compile (-Werror), Checkstyle, all four test suites, JaCoCo and OWASP dependency-check.
      # DEFERRAL (Principle XIII): see specs/002-reference-data-api/plan.md § Complexity Tracking,
      # "OWASP scan in CI waits for NVD_API_KEY". Until the NVD_API_KEY secret exists, the scan is skipped
      # with a visible warning on the run. Once the secret is added, the full scan runs with no change here.
      # When that happens, replace this script with a plain `./gradlew check`, so a missing key fails loudly
      # again (the build.gradle guard). Pull requests from forks never receive secrets, so for them the scan
      # is skipped too: a maintainer must re-run them from a branch in this repository before merge.
      - name: Build and check
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            ./gradlew check
          else
            echo "::warning title=OWASP dependency-check skipped::NVD_API_KEY is not set, so the OWASP scan did not run (documented deferral in specs/002-reference-data-api/plan.md)."
            ./gradlew check -PskipOwasp
          fi
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      # DEFERRAL (Principle XIII): see specs/002-reference-data-api/plan.md § Complexity Tracking,
      # "Sonar step in CI stays inactive". SONAR_TOKEN is available as an HMCTS organisation secret, but the
      # SonarQube Cloud project uses Automatic Analysis, which rejects a CI analysis, so this step is disabled.
      # Once a SonarQube Cloud admin switches Automatic Analysis off (Administration -> Analysis Method),
      # delete the `if: false` line so a failing quality gate fails CI.
      - name: Sonar analysis
        if: false
        run: ./gradlew sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Dependency freshness
        if: always()
        run: ./gradlew dependencyUpdates

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: build-reports
          path: |
            build/dependencyUpdates/
            build/reports/jacoco/
            build/reports/tests/
            build/test-results/
            build/reports/checkstyle/
            build/reports/dependency-check-report.*
          if-no-files-found: ignore
